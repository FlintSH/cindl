# One workspace, one lockfile for runtime code. The handbook site in
# docs/handbook is planned as a separate pnpm project with its own lockfile, so
# docs tooling never ships in a runtime package.
packages:
  - packages/*
  - apps/*

saveExact: true
engineStrict: true
# pnpm 11 refuses releases younger than its minimum release age by default.
# Keep it on: pick an older version instead of adding exclusions.

# Shared versions. Reference them as "catalog:" so web, desktop and Android
# can never drift onto different React/TypeScript/Zod versions.
catalog:
  '@types/node': 24.19.2
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 6.0.3
  vitest: 5.1.0
  zod: 4.6.7

# Dependency install scripts are denied unless reviewed and listed here.
allowBuilds:
  # Windows Squirrel installer pulled in by electron-builder (apps/desktop).
  # Cindl packages Linux only, so its install script stays denied.
  electron-winstaller: false
  # apps/desktop bundles with esbuild's JS API, which runs the binary from the
  # @esbuild/<platform> optional package; the install script only optimizes.
  esbuild: false

# Security overrides for transitive dev tooling. Remove each one once its
# dependents accept the patched version. Alerts left without one, and why,
# are in docs/handbook/development/workflow.md (glob 13, under Expo's tools).
overrides:
  # GHSA-g3hv-75wg-m249 (ReDoS through glob parts). Dev-only. 11.0.1 is the
  # first fix. It also replaces the ^3 that electron-builder's glob@7.2.3 and
  # @electron/asar@3.4.1 ask for, not only eslint's and typescript-eslint's
  # ^10. Packaging works because electron-builder 26 never takes asar's own
  # unpack path, which calls minimatch's default export (gone in 11). Remove
  # the override once all four accept a fixed minimatch.
  minimatch: 11.0.3
