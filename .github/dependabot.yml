# Weekly, grouped dependency updates. The cooldown keeps proposals older than
# pnpm's minimum release age, so `pnpm install --frozen-lockfile` accepts them.
# Dependabot commits that change only manifests, lockfiles and workflows pass
# the docs-impact gate without a trailer (scripts/lib/docs-impact.mjs).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Majors that need a deliberate migration, not a weekly bump:
    # @types/node follows the pinned Node 24 toolchain (.node-version), and
    # TypeScript 7 is not supported by typescript-eslint yet (the lint step
    # fails with "typescript-eslint does not support TS 7.0").
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      runtime-workspace:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /docs/handbook
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      handbook:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
