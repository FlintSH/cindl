name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify and repository gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the source with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js (version from .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify (format, lint, typecheck, unit tests, tokens)
        run: pnpm verify
      - name: Privacy and secret scan
        run: node scripts/check-privacy.mjs
      - name: Licence check
        run: node scripts/check-license.mjs
      - name: Test the gates
        run: node --test "scripts/test/*.test.mjs"
      - name: Docs impact of each commit in the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-docs-impact.mjs --base "$BASE_SHA"
      - name: Docs impact of each pushed commit
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: node scripts/check-docs-impact.mjs --base "$BASE_SHA"
      - name: Build the production web client
        run: pnpm --filter @cindl/web build
      - name: Check the production output has no demo data or local paths
        run: node scripts/check-dist.mjs apps/web/dist
