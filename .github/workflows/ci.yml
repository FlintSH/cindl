name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # One group per pushed commit: a newer push never cancels or drops an older
  # run, so every before..after range is checked for docs impact.
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify and repository gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the source with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js (version from .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # verify includes the privacy, licence and docs gates, the gate tests, and
      # both web builds with the build-output gate (pnpm check:dist).
      - name: Verify (format, lint, types, tests, tokens, gates, web builds)
        run: pnpm verify
      - name: Privacy and secret scan
        run: node scripts/check-privacy.mjs
      - name: Licence check
        run: node scripts/check-license.mjs
      - name: Test the gates
        run: node --test "scripts/test/*.test.mjs"
      - name: Docs impact of each commit in the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-docs-impact.mjs --base "$BASE_SHA"
      - name: Docs impact of each pushed commit
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: node scripts/check-docs-impact.mjs --base "$BASE_SHA"

  web-e2e:
    name: Web end-to-end on the synthetic demo
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js (version from .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright's bundled Chromium
        run: pnpm --filter @cindl/web exec playwright install --with-deps chromium
      # The suite builds the demo (build:demo) and serves it on 127.0.0.1:4173.
      - name: Run the end-to-end suite
        run: pnpm --filter @cindl/web test:e2e
      - name: Keep traces of a failed run (synthetic data only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e-results-${{ github.sha }}
          path: .agent-artifacts/web-e2e-results
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
