name: Documentation problem
description: A handbook page is wrong, missing or unclear.
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: Handbook page path or link, and the commit shown in its build stamp.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
      description: Quote the text and say what the code or app actually does. Synthetic examples only.
    validations:
      required: true
