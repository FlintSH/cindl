// Local Expo module (autolinked from apps/android/modules). Paints the agent
// screen's picture into a Bitmap; no permissions, no network.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.fl1nt.cindl.screen'
version = '0.1.0'

android {
  namespace "dev.fl1nt.cindl.screen"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
}
