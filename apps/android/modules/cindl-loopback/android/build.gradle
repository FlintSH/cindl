// Local Expo module (autolinked from apps/android/modules). Pure JVM networking
// only: no Android permissions beyond the app's INTERNET.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.fl1nt.cindl.loopback'
version = '0.1.0'

android {
  namespace "dev.fl1nt.cindl.loopback"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
}
